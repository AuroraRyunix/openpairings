name: Build Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            warp_arch: windows-x64
            exec_name: openpairings.exe
            runner: run_packed.bat
          - os: ubuntu-latest
            arch: x64
            warp_arch: linux-x64
            exec_name: openpairings-linux-x64
            runner: run_packed.sh
          - os: macos-latest
            arch: arm64
            warp_arch: macos-x64 # warp-packer uses macos-x64 but runs fine via Rosetta, or macos-arm64 if supported
            exec_name: openpairings-macos-arm64
            runner: run_packed.sh

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Elixir & Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.2'
          otp-version: '27.0'

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod

      - name: Deploy Assets
        env:
          MIX_ENV: prod
        run: mix assets.deploy

      - name: Create Mix Release
        env:
          MIX_ENV: prod
        run: mix release

      # Write launcher script for Linux/macOS
      - name: Create Linux/macOS launcher script
        if: matrix.os != 'windows-latest'
        run: |
          cat << 'EOF' > _build/prod/rel/pairings_engine/run_packed.sh
          #!/bin/bash
          export PHX_SERVER=true
          export PORT=${PORT:-4000}
          export PHX_HOST=${PHX_HOST:-localhost}
          export DATABASE_PATH=${DATABASE_PATH:-$PWD/pairings_engine.db}
          if [ -z "$SECRET_KEY_BASE" ]; then
            export SECRET_KEY_BASE="db0dfb3d2b2c4e69b8efca1c888e2f896b0dfb3d2b2c4e69b8efca1c888e2f896b0dfb3d2b2c"
          fi
          exec "$(dirname "$0")/bin/pairings_engine" start
          EOF
          chmod +x _build/prod/rel/pairings_engine/run_packed.sh

      # Write launcher script for Windows
      - name: Create Windows launcher script
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          @'
          @echo off
          setlocal
          set "PHX_SERVER=true"
          if "%PORT%"=="" set "PORT=4000"
          if "%PHX_HOST%"=="" set "PHX_HOST=localhost"
          if "%DATABASE_PATH%"=="" set "DATABASE_PATH=%CD%\pairings_engine.db"
          if "%SECRET_KEY_BASE%"=="" set "SECRET_KEY_BASE=db0dfb3d2b2c4e69b8efca1c888e2f896b0dfb3d2b2c4e69b8efca1c888e2f896b0dfb3d2b2c"
          call "%~dp0bin\pairings_engine.bat" start
          '@ | Out-File -FilePath _build/prod/rel/pairings_engine/run_packed.bat -Encoding ascii

      # Download warp-packer
      - name: Download warp-packer (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          curl -L https://github.com/dgiagio/warp/releases/download/v0.3.0/${{ matrix.warp_arch }}.warp-packer -o warp-packer
          chmod +x warp-packer

      - name: Download warp-packer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe" -OutFile warp-packer.exe

      # Package release into a single binary
      - name: Package with warp-packer (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          ./warp-packer --arch ${{ matrix.warp_arch }} --input_dir "_build/prod/rel/pairings_engine" --exec "${{ matrix.runner }}" --output "${{ matrix.exec_name }}"

      - name: Package with warp-packer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\warp-packer.exe --arch windows-x64 --input_dir "_build/prod/rel/pairings_engine" --exec "run_packed.bat" --output "${{ matrix.exec_name }}"

      # Upload the compiled binary as a workflow artifact
      - name: Upload Artifact
        uses: actions/artifacts@v4
        with:
          name: openpairings-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.exec_name }}
