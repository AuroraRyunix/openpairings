# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    # Pinned rather than `ubuntu-latest`: GitHub has announced that label
    # moving to Ubuntu 26.04 in November 2026, and 26.04 is still a public
    # preview today (2026-09-27) - not something to land on by surprise on
    # whatever push happens to land after the switch. Revisit once 26.04 has
    # been the default for a while and erlef/setup-beam has OTP builds for it.
    runs-on: ubuntu-24.04

    steps:
    # Actions are pinned to a commit, not to a tag. A tag is mutable, and
    # whoever can move it runs their code in this workflow with this
    # repository checked out. The trailing comment is the human-readable
    # version; .github/dependabot.yml is what keeps the pair current for
    # patch/minor bumps, but ignores majors on purpose - checkout v4->v7,
    # cache v4->v6, upload/download-artifact and action-gh-release below were
    # raised by hand on 2026-09-27, for the Node 20 Actions runtime
    # deprecation (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/):
    # the old pins were being silently forced onto Node 24 already.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.20' # [Required] Define the Elixir version
        otp-version: '29.0'    # [Required] Define the Erlang/OTP version

    - name: Restore dependencies and build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: Install dependencies
      # --check-locked: a mix.exs constraint edited without a matching
      # mix.lock update re-resolves silently, and CI would then be testing a
      # dependency tree that exists nowhere else. This fails instead.
      run: mix deps.get --check-locked

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Check formatting
      run: mix format --check-formatted

    - name: Run tests
      # javafo.jar (third-party, not committed - see test/test_helper.exs)
      # and the gitignored SWAR fixtures (real personal data) are the only
      # two exclusions this runner is allowed: both are permanent, known
      # gaps, not something a fetch step here can close (see the fetch
      # investigation in test_helper.exs). Anything ELSE test_helper.exs
      # would have to silently exclude - bbpPairings' vendored binary, which
      # is committed and should always be present on this Linux runner -
      # fails the build instead, because that would be a real regression.
      # The one addition: bbppairings. The vendored Linux binary is 32-bit and
      # needs a GLIBC_ABI_GNU_TLS version this runner's 32-bit libc lacks
      # (libc6-i386 does not provide it), so it cannot start here;
      # BbpPairings.available?/0 detects that and the bbpPairings comparisons
      # run on the maintainer's machine only.
      run: mix test
      env:
        SKIP_MISSING_ARTIFACTS: swar_fixture,javafo,snapshot_fixtures,bbppairings
