name: Build binaries

# Builds a single self-contained executable per OS/arch with Burrito, each on
# its NATIVE runner (so the SQLite NIF is native — no cross-compile guesswork).
# Runs on demand, and attaches the binaries to a GitHub release on a v* tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-13, target: macos_x86_64 }
          - { runner: macos-14, target: macos_aarch64 }
          - { runner: ubuntu-latest, target: linux_x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux_aarch64 }
          - { runner: windows-latest, target: windows_x86_64 }
          # Windows/ARM OTP builds aren't always available to setup-beam yet —
          # kept best-effort so it never blocks the other five.
          - { runner: windows-11-arm, target: windows_aarch64 }

    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0"
          elixir-version: "1.20"

      - uses: mlugg/setup-zig@v2
        with:
          # Burrito 1.5 requires exactly this Zig version.
          version: 0.15.2

      # Burrito compresses the payload with xz — present on the Linux/macOS
      # images, installed here for Windows.
      - name: Install xz (Windows)
        if: runner.os == 'Windows'
        run: choco install xz --no-progress -y

      - run: mix deps.get

      # Colocated CSS/JS is generated during compile, before assets.deploy.
      - run: mix compile
      - run: mix assets.deploy

      - run: mix release --overwrite

      - uses: actions/upload-artifact@v4
        with:
          name: pairings_engine_${{ matrix.target }}
          path: burrito_out/*
          if-no-files-found: error

      - name: Attach to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: burrito_out/*
