name: Build binaries

# Builds a single self-contained executable per OS/arch with Burrito, each on
# its NATIVE runner (so the SQLite NIF is native - no cross-compile guesswork).
#
# Runs on EVERY push to main, not only on tags. It used to be tags plus manual
# dispatch, and the result was a month between builds while the app changed
# underneath them - by the time anyone looked, "do the binaries still build"
# was a question nobody could answer without an experiment. The binaries are a
# shipped artifact; a shipped artifact that is only built at release time is
# only tested at release time.
#
# Deliberately NO `paths-ignore` for docs. CHANGELOG.md is compiled INTO the
# binary (`PairingsEngine.Changelog` reads it via @external_resource at build
# time), so a "docs-only" change is not docs-only here.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# A run per push, and pushing three commits in a row should not tie up five
# runners building the first two. Tags are exempt: a release build must finish
# even if another tag lands while it is going.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default, and the build job below keeps it. Only the release
# job - which runs on tags and nowhere else - is granted `contents: write`.
# It used to be granted here, which handed write access to all five matrix
# jobs on every push to main: five runners, each running third-party actions,
# each able to write to this repository, for a build that publishes nothing.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the Intel runner (macos-13 was retired); plain
          # macos-15 is Apple silicon.
          - { runner: macos-15-intel, target: macos_x86_64 }
          - { runner: macos-15, target: macos_aarch64 }
          - { runner: ubuntu-latest, target: linux_x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux_aarch64 }
          - { runner: windows-latest, target: windows_x86_64 }
          # No windows_aarch64: Erlang/OTP publishes no Windows/ARM build, so
          # setup-beam cannot provision the ARM runner. Windows on ARM runs the
          # x86_64 binary under its built-in emulation.

    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}

    steps:
      # Actions are pinned to a commit, not to a tag. A tag is mutable, and
      # whoever can move it runs their code on five runners here. The
      # trailing comment is the human-readable version; .github/dependabot.yml
      # is what keeps the pair current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20"

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Burrito 1.5 requires exactly this Zig version.
          version: 0.15.2

      # Burrito shells out to `xz` to compress the payload. The Linux and macOS
      # images ship one; Windows does not, and there is no chocolatey package
      # for it, so take it from the preinstalled MSYS2. Only xz and its DLLs are
      # copied out: putting all of C:\msys64\usr\bin on PATH would shadow
      # Windows tools (find, sort, link) for the build steps below.
      - name: Install xz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed xz
          $dst = Join-Path $env:RUNNER_TEMP "xz"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item C:\msys64\usr\bin\xz.exe $dst
          Copy-Item C:\msys64\usr\bin\msys-2.0.dll $dst
          Copy-Item C:\msys64\usr\bin\msys-lzma-*.dll $dst
          $dst | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Fail here, not deep inside `mix release`, if a DLL is missing.
          & (Join-Path $dst "xz.exe") --version

      # --only prod, because MIX_ENV is prod here and nothing else is needed.
      # --check-locked: a mix.exs constraint edited without a matching
      # mix.lock update re-resolves silently, and the binary shipped from
      # this job would then contain a dependency tree nobody committed.
      - run: mix deps.get --only prod --check-locked

      # Colocated CSS/JS is generated during compile, before assets.deploy.
      - run: mix compile
      - run: mix assets.deploy

      # Named explicitly. `default_release` in mix.exs covers the bare form,
      # but a build script should not depend on which release is the default.
      - run: mix release pairings_engine --overwrite

      # Pinned to the same velopack_libc version as the `vpk` pin further
      # down (1.2.0) - not "latest", for the same reason that pin is a
      # version and not a floating one. The checksum is this exact .zip's
      # own SHA256, computed once from the real download and hardcoded here,
      # so a corrupted or substituted asset on GitHub's end fails this step
      # loudly rather than shipping silently in every release from here on.
      #
      # Hard-fail (no soft skip like "Skipping OpenPairings.exe" below):
      # unlike a developer machine that may not have Zig installed, this
      # runner always has network access, so a failure here means something
      # is actually wrong - the checksum mismatching most of all - and that
      # is worth stopping the whole Windows build over, not shipping a
      # release that silently lacks the in-app update button.
      #
      # Runs on every push, same as the rest of this job (see this file's
      # own top comment on why binaries build on every push and not only
      # tags): mix.exs's windows_velopack_dll/1 release step below copies
      # this DLL into the portable payload whenever it is present, and skips
      # itself otherwise - the same soft behaviour a developer machine
      # without this file gets locally, so a branch build missing it just
      # does not carry the button.
      - name: Fetch velopack_libc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vpkcVersion = "1.2.0"
          $url = "https://github.com/velopack/velopack/releases/download/$vpkcVersion/velopack_libc_$vpkcVersion.zip"
          $expectedSha256 = "547262ed7a1ab1ff62f580aa53851ede2f1a451ac61b8974eb7bc01117488835"
          $zip = Join-Path $env:RUNNER_TEMP "velopack_libc.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "velopack_libc"

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "velopack_libc_$vpkcVersion.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -Path $zip -DestinationPath $extractDir -Force

          # Renamed on the way in - see rel/windows/.gitignore and mix.exs's
          # windows_velopack_dll/1: velopack_libc.dll is the name baked into
          # this DLL's own export table, not the filename Velopack ships it
          # under (confirmed by actually loading it under that name).
          $dll = Join-Path $extractDir "lib\velopack_libc_win_x64_msvc.dll"
          if (-not (Test-Path $dll)) {
            throw "lib\velopack_libc_win_x64_msvc.dll not found in velopack_libc_$vpkcVersion.zip"
          }
          Copy-Item -Path $dll -Destination "rel\windows\velopack_libc.dll" -Force

          Get-Item "rel\windows\velopack_libc.dll" |
            Select-Object Name, @{n = 'KB'; e = { [math]::Round($_.Length / 1KB, 1) } }

      # The same app as an ordinary Erlang release - a folder with the runtime
      # inside and a launcher beside it. Built because the single-file binary
      # gets DELETED by antivirus, not warned about: an unsigned executable
      # carrying a compressed payload that unpacks a runtime and spawns
      # processes is byte-for-byte what a dropper looks like. Signing is the
      # real fix on Windows and needs a certificate and a hardware token; this
      # needs neither and works today.
      - run: mix release pairings_engine_portable --overwrite

      # The Windows entry point, OpenPairings.exe, is produced by a release
      # step (mix.exs -> windows_launcher/1) that skips itself when Zig is not
      # on PATH. Zig is always on PATH here, so a missing file means the step
      # did not run at all - and nothing downstream would notice until somebody
      # tried to pack an installer, or worse, ran one.
      #
      # The subsystem check is the other half. "No console window" is one
      # linker flag, it is invisible in the source, and a regression would only
      # show up as a black window on an arbiter's screen.
      - name: Check the Windows launcher was built
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "_build\prod\rel\pairings_engine_portable\OpenPairings.exe"
          if (-not (Test-Path $exe)) {
            throw "No OpenPairings.exe in the portable release - the mix.exs release step did not run."
          }
          $item = Get-Item $exe
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($item.FullName).FileVersion
          Write-Host "OpenPairings.exe $version, $([math]::Round($item.Length / 1KB, 1)) KB"

          $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 92)
          if ($subsystem -ne 2) {
            throw "OpenPairings.exe has subsystem $subsystem, not 2 (GUI) - it would show a console window."
          }

          # velopack_libc.dll travels with the release step above, not as an
          # overlay - see mix.exs's windows_velopack_dll/1. The "Fetch
          # velopack_libc" step earlier in this job hard-fails if it cannot
          # get the DLL, so finding it missing here means the release step
          # itself did not run, the same reasoning the OpenPairings.exe check
          # above already applies.
          $dll = "_build\prod\rel\pairings_engine_portable\velopack_libc.dll"
          if (-not (Test-Path $dll)) {
            throw "No velopack_libc.dll in the portable release - the mix.exs windows_velopack_dll/1 release step did not run."
          }
          Write-Host "velopack_libc.dll $([math]::Round((Get-Item $dll).Length / 1KB, 1)) KB"

      # Prove the thing we just built actually starts. A Burrito build can
      # succeed and still produce a binary that dies at boot - the release
      # evaluates config/runtime.exs, which the test suite exercises through
      # Config.Reader but never through a real BEAM start with a real
      # self-extracting wrapper around it.
      #
      # Started with NO configuration - no OPENPAIRINGS_LOCAL, nothing but a
      # scratch data directory and a port to keep runners isolated. That is
      # deliberate: the first version of this passed `OPENPAIRINGS_LOCAL=1`,
      # which proved the flag worked and said nothing about what happens when
      # somebody just runs the file. Which is what they do, and it crashed -
      # "environment variable DATABASE_PATH is missing" plus a crash dump.
      #
      # So the binary now defaults to local mode (it exports `__BURRITO`, and
      # a self-extracting executable is not a server), and this step is the
      # thing that would have caught that: run it the way a person runs it.
      # The assertion is that the page comes back AND carries the
      # auto-signed-in owner's address.
      - name: Smoke test the binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find burrito_out -maxdepth 1 -type f | head -1)
          echo "starting $bin"
          chmod +x "$bin"

          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-smoke"
          export PORT=4001

          "$bin" start > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!

          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4001/ 2>/dev/null); then
              ok=yes
              break
            fi
            # If it already exited, stop waiting for a server that is gone.
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::binary did not serve a page"
            cat "$RUNNER_TEMP/smoke.log" || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          kill "$pid" 2>/dev/null || true

          case "$body" in
            *".local"*) echo "signed in as the local owner" ;;
            *) echo "::error::served a page but did not auto-sign-in"
               echo "$body" | head -40
               exit 1 ;;
          esac

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = (Get-ChildItem burrito_out -File | Select-Object -First 1).FullName
          Write-Host "starting $bin"

          $env:OPENPAIRINGS_DATA_DIR = Join-Path $env:RUNNER_TEMP "op-smoke"
          $env:PORT = "4001"

          $log = Join-Path $env:RUNNER_TEMP "smoke.log"
          $proc = Start-Process -FilePath $bin -ArgumentList "start" -PassThru `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow

          $body = $null
          foreach ($i in 1..90) {
            try {
              $body = (Invoke-WebRequest -Uri "http://127.0.0.1:4001/" -TimeoutSec 5 -UseBasicParsing).Content
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 2
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          if (-not $body) {
            Write-Host "::error::binary did not serve a page"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path "$log.err") { Get-Content "$log.err" }
            exit 1
          }

          if ($body -notmatch "\.local") {
            Write-Host "::error::served a page but did not auto-sign-in"
            Write-Host ($body.Substring(0, [Math]::Min(2000, $body.Length)))
            exit 1
          }

          Write-Host "signed in as the local owner"

      - name: Smoke test the portable release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-portable"
          export PORT=4002

          # Through the LAUNCHER, not the release script underneath it: the
          # launcher is what sets local mode here, so testing around it would
          # test everything except the part that is new.
          rel_dir=_build/prod/rel/pairings_engine_portable
          chmod +x "$rel_dir/openpairings.sh"
          "$rel_dir/openpairings.sh" > "$RUNNER_TEMP/portable.log" 2>&1 &
          pid=$!

          body=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4002/ 2>/dev/null); then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          # Erlang distribution must be off end-to-end for this launcher - see
          # the CHANGELOG entries mentioning "distribution". Checked here,
          # while the process from above is still up, rather than in a step
          # of its own: openpairings.sh is Unix-only, this step already
          # starts it for real, and a second boot would only prove the same
          # thing slower. Linux only - the macOS runner gets its own check
          # below, against the .app bundle rather than this script, because
          # that bundle carries its own separately-written launcher.
          #
          # `ss` (iproute2) ships on both Ubuntu images this workflow uses
          # (ubuntu-latest, ubuntu-24.04-arm); it has no macOS equivalent,
          # which is why that check uses `lsof` instead. `-ltnp` = listening,
          # TCP, numeric (no DNS/service-name lookups slowing this down),
          # with the owning process. No sudo: `ss -p` shows a process without
          # root as long as it belongs to the calling user, which the runner
          # user does here - it started openpairings.sh itself, above.
          dist_status=0
          if [ "$RUNNER_OS" = "Linux" ] && [ -n "$body" ]; then
            listeners=$(ss -ltnp)
            echo "$listeners"

            # epmd, if it started at all, is what distribution needs to be
            # reachable - so its absence is the headline check.
            if echo "$listeners" | awk '$1=="LISTEN"{print $4}' | grep -q ':4369$'; then
              echo "::error::epmd is listening on 4369 - Erlang distribution is on"
              dist_status=1
            fi

            # Whatever the BEAM itself has open must be exactly the web port,
            # on loopback, and nothing else - a stray distribution listener
            # is opened by the same process, not a second one.
            beam_addrs=$(echo "$listeners" | awk '$1=="LISTEN" && $NF ~ /beam/ {print $4}' | sort -u)
            echo "beam.smp listening on: ${beam_addrs:-<nothing found>}"

            if [ -z "$beam_addrs" ]; then
              echo "::error::no beam.smp listener found in ss output"
              dist_status=1
            elif [ "$beam_addrs" != "127.0.0.1:${PORT}" ]; then
              echo "::error::the BEAM is listening on more than the web port"
              dist_status=1
            fi
          fi

          kill "$pid" 2>/dev/null || true

          case "$body" in
            *".local"*) echo "portable release signed in as the local owner" ;;
            *) echo "::error::portable release did not serve a signed-in page"
               cat "$RUNNER_TEMP/portable.log" || true
               exit 1 ;;
          esac

          if [ "$dist_status" != 0 ]; then
            exit 1
          fi

      - name: Smoke test the portable release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENPAIRINGS_DATA_DIR = Join-Path $env:RUNNER_TEMP "op-portable"
          $env:PORT = "4002"
          $log = Join-Path $env:RUNNER_TEMP "portable.log"

          $launcher = "_build\prod\rel\pairings_engine_portable\OpenPairings.bat"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $launcher -PassThru `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow

          $body = $null
          foreach ($i in 1..90) {
            try {
              $body = (Invoke-WebRequest -Uri "http://127.0.0.1:4002/" -TimeoutSec 5 -UseBasicParsing).Content
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 2
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          if (-not $body -or $body -notmatch "\.local") {
            Write-Host "::error::portable release did not serve a signed-in page"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path "$log.err") { Get-Content "$log.err" }
            exit 1
          }

          Write-Host "portable release signed in as the local owner"

      - name: Name the downloads after the product
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd burrito_out
          for f in pairings_engine_*; do
            [ -e "$f" ] || continue
            mv "$f" "openpairings_${f#pairings_engine_}"
          done
          ls -l

      - name: Name the downloads after the product (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem burrito_out -File |
            Where-Object { $_.Name -like 'pairings_engine_*' } |
            ForEach-Object {
              Rename-Item $_.FullName -NewName ($_.Name -replace '^pairings_engine_', 'openpairings_')
            }
          Get-ChildItem burrito_out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openpairings_portable_${{ matrix.target }}
          # Straight from where mix assembled it. There used to be a copy
          # step here, purely to rename the folder inside the zip, and it
          # failed on Windows - Git Bash's `cp -r` on the ERTS bin directory
          # gives "cannot create regular file .../erts-17.0.5/bin/erl: File
          # exists". A cosmetic step is not worth a platform-specific bug.
          path: _build/prod/rel/pairings_engine_portable
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openpairings_${{ matrix.target }}
          path: burrito_out/*
          if-no-files-found: error
          # A tag build's artifacts are also attached to the release below, so
          # these are the throwaway copy - kept long enough to grab one off a
          # branch build, not long enough to accumulate. Tag builds keep the
          # default 90 days.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Zip the portable release for the release page
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os != 'Windows'
        shell: bash
        run: |
          cd _build/prod/rel
          zip -qr "openpairings_portable_${{ matrix.target }}.zip" pairings_engine_portable
          ls -lh openpairings_portable_${{ matrix.target }}.zip

      - name: Build macOS .dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Read the version BEFORE the `cd` - mix.exs is in the workspace
          # root, and it is the single source of truth for it (the release job
          # below reads it the same way, and rel/windows/build_installer.ps1
          # does the same for the Windows installer; mix pairings.version_check
          # keeps CHANGELOG.md, TODO.md and docs/features.md agreeing with it).
          #
          # This was hardcoded until 0.56.x, and had said 0.18.0 the whole
          # time: the bundle told Finder, Spotlight and every crash reporter
          # that an 0.56 application was 0.18. Nothing in a build reads
          # Info.plist back, so no step could have caught it - the only real
          # defence is not keeping a second copy of the number.
          version=$(grep -m1 "version:" mix.exs | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "Could not read a version out of mix.exs" >&2
            exit 1
          fi

          cd _build/prod/rel
          app_name="OpenPairings.app"
          rm -rf "$app_name" dmg_staging
          mkdir -p "$app_name/Contents/MacOS"
          mkdir -p "$app_name/Contents/Resources/app"

          # Copy the portable release into Resources/app
          cp -R pairings_engine_portable/* "$app_name/Contents/Resources/app/"

          # Create Info.plist. The heredoc stays quoted so the plist body is
          # never shell-expanded - it is full of `version="1.0"` attributes and
          # double quotes, and one stray `$` in a future edit should not become
          # an empty string. The version arrives through sed instead.
          cat << 'EOF' | sed -e 's/^[ ]*//' -e "s/__VERSION__/${version}/g" > "$app_name/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OpenPairings</string>
              <key>CFBundleIdentifier</key>
              <string>cloud.zerotwo.openpairings</string>
              <key>CFBundleName</key>
              <string>OpenPairings</string>
              <key>CFBundleDisplayName</key>
              <string>OpenPairings</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>__VERSION__</string>
              <key>CFBundleVersion</key>
              <string>__VERSION__</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Create launcher script in Contents/MacOS/OpenPairings
          cat << 'EOF' | sed 's/^[ ]*//' > "$app_name/Contents/MacOS/OpenPairings"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")/../Resources/app" && pwd)"
          export OPENPAIRINGS_LOCAL=1
          export PORT=${PORT:-4000}
          # Erlang distribution off, for the reason openpairings.sh spells out
          # at length: a release otherwise starts `epmd` on 0.0.0.0:4369 and a
          # node listener on 0.0.0.0:<ephemeral>, authorised by a cookie that
          # ships inside the download and is therefore the same on every copy.
          #
          # It matters most here. Finder gives this bundle no console, so there
          # is no Ctrl-C and no visible output - an arbiter has no way to notice
          # a listener they did not ask for, and no way to stop it short of
          # Force Quit. Nothing in the bundle used distribution anyway: Force
          # Quit sends SIGTERM to the foreground BEAM, which is not an RPC.
          export RELEASE_DISTRIBUTION=${RELEASE_DISTRIBUTION:-none}
          exec "$DIR/bin/pairings_engine_portable" start
          EOF
          chmod +x "$app_name/Contents/MacOS/OpenPairings"

          # Ad-hoc code sign the entire bundle for Apple Silicon / macOS integrity
          codesign --force --deep --sign - "$app_name"

          # Stage DMG with /Applications symlink
          mkdir -p dmg_staging
          cp -R "$app_name" dmg_staging/
          ln -s /Applications dmg_staging/Applications

          dmg_name="openpairings_${{ matrix.target }}.dmg"
          # GitHub's macOS runners intermittently refuse this with "hdiutil:
          # create failed - Resource busy" - a runner-side race, not this
          # build, and it has hit this job more than once. On a tag it blocks
          # the whole release, because the release job needs every target, so
          # a few spaced retries before giving up.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "OpenPairings" -srcfolder dmg_staging -ov -format UDZO "$dmg_name"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::hdiutil create failed 5 times" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt), retrying in $((attempt * 5))s" >&2
            sleep $((attempt * 5))
          done
          ls -lh "$dmg_name"

      # Same reasoning as the portable-release smoke test above, for the
      # bundle Finder actually launches: a build can succeed and still
      # produce something that dies at boot, or that boots with distribution
      # on, and nothing before this ever ran the heredoc launcher above for
      # real. macos_x86_64 and macos_aarch64 both run this, natively.
      - name: Smoke test the macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          # Exec the bundle's own launcher directly - Contents/MacOS/OpenPairings,
          # written a few lines up - rather than `open -a`, which hands the
          # process to launchd and leaves nothing here to curl or kill.
          # Finder would run this same file; it does not care who invoked it.
          app="_build/prod/rel/OpenPairings.app/Contents/MacOS/OpenPairings"
          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-app"
          export PORT=4003

          # The launcher turns on local mode, and local mode makes
          # PairingsEngine.BrowserLauncher try to `open` this URL in a real
          # browser window once the port is up - fine on somebody's Mac, a
          # GUI call to nothing on this headless runner. It is fire-and-forget
          # (see the module doc) so it cannot fail the boot, but there is no
          # reason to let a stray `open` linger either. OPENPAIRINGS_NO_BROWSER
          # is the variable the app already reads for exactly this case; the
          # launcher does not touch it, so exporting it here reaches the BEAM
          # the same way PORT and OPENPAIRINGS_DATA_DIR do.
          export OPENPAIRINGS_NO_BROWSER=1

          "$app" > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!

          body=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4003/ 2>/dev/null); then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          # Checked while still running, same as the Linux check above and
          # for the same reason. `lsof`, not `ss` - the macOS runner image
          # has no iproute2. -nP: numeric host/port, no DNS or /etc/services
          # lookups slowing this down. -sTCP:LISTEN: listening sockets only.
          # No sudo, same reasoning as the Linux check: lsof can see any
          # process's sockets that belong to the invoking user without it,
          # and the runner user is who started the app above.
          dist_status=0
          if [ -n "$body" ]; then
            listeners=$(lsof -nP -iTCP -sTCP:LISTEN)
            echo "$listeners"

            if echo "$listeners" | awk 'NR>1{print $9}' | grep -q ':4369$'; then
              echo "::error::epmd is listening on 4369 - Erlang distribution is on"
              dist_status=1
            fi

            beam_addrs=$(echo "$listeners" | awk 'NR>1 && $1 ~ /beam/ {print $9}' | sort -u)
            echo "beam.smp listening on: ${beam_addrs:-<nothing found>}"

            if [ -z "$beam_addrs" ]; then
              echo "::error::no beam.smp listener found in lsof output"
              dist_status=1
            elif [ "$beam_addrs" != "127.0.0.1:${PORT}" ]; then
              echo "::error::the BEAM is listening on more than the web port"
              dist_status=1
            fi
          fi

          kill "$pid" 2>/dev/null || true

          if [ -z "$body" ]; then
            echo "::error::the macOS .app bundle did not serve a page"
            cat "$RUNNER_TEMP/app.log" || true
            exit 1
          fi

          case "$body" in
            *".local"*) echo "macOS .app bundle signed in as the local owner" ;;
            *) echo "::error::macOS .app bundle served a page but did not auto-sign-in"
               echo "$body" | head -40
               exit 1 ;;
          esac

          if [ "$dist_status" != 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'macOS'
        with:
          name: openpairings_dmg_${{ matrix.target }}
          path: _build/prod/rel/*.dmg
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Zip the portable release for the release page (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "_build/prod/rel/openpairings_portable_${{ matrix.target }}.zip"
          Compress-Archive -Path "_build/prod/rel/pairings_engine_portable" -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      # The Windows installers (Setup.exe + the .msi) and the update feed a
      # future in-app updater will read - see docs/binaries.md's "The Windows
      # installers and the update feed" for what gets attached and why, and
      # rel/windows/build_installer.ps1's .NOTES for what building --msi
      # established about where it installs and whether it can update
      # without admin. Tag builds only, same as the zip above: a real
      # installer for every push to main is not worth the ~45s WiX
      # compilation costs for builds that are never downloaded.
      - name: Install vpk (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to the exact version this was built and verified against
          # locally (`vpk --version`) - not "latest", which would let a vpk
          # release nobody has run against this project's payload decide
          # what ships.
          dotnet tool install -g vpk --version 1.2.0

      - name: Fetch the previous Windows release for delta packages
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best-effort, deliberately not checked. `vpk pack` below (its
          # default --delta BestSpeed, unchanged by build_installer.ps1) only
          # produces a delta package when it finds a previous version's
          # .nupkg already sitting in -outputDir to diff against - it does
          # not fetch one itself, so this is what makes delta generation do
          # anything at all. It can legitimately find nothing: the first tag
          # to carry this feed has no previous release to fetch, and that is
          # not a failure - `vpk pack` below still succeeds either way, it
          # just ships a Full-only package for this version when there was
          # nothing to diff against. A transient network error here must not
          # fail the release either, hence `exit 0` regardless of how the
          # command above went.
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          vpk download github --repoUrl https://github.com/AuroraRyunix/openpairings --channel win --outputDir installer_out --token $env:GH_TOKEN

          # Discard a download whose version equals the one THIS job is
          # building - found 2026-09-11 re-running a release build for an
          # already-published tag: `vpk download github` fetches the LATEST
          # release, which on a re-run IS this version, and `vpk pack` below
          # then refuses outright ("already holds a $Version package" - see
          # build_installer.ps1's own check) even though a real PREVIOUS
          # version's .nupkg would otherwise be sitting right next to it to
          # diff against. A normal next-version build never hits this - the
          # latest published release is always the version before the one
          # being built - so this only ever discards something on exactly
          # the re-run case, and a normal build's deltas are untouched.
          $match = Select-String -Path mix.exs -Pattern 'version:\s*"([0-9]+\.[0-9]+\.[0-9]+)"' |
            Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if (Test-Path installer_out) {
            Get-ChildItem installer_out -Filter "*$version*.nupkg" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Discarding downloaded $($_.Name) - same version as this build ($version)" -ForegroundColor DarkGray
                Remove-Item $_.FullName -Force
              }
          }

          exit 0

      - name: Pack the Windows installers
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          # No -Version: build_installer.ps1 reads it from mix.exs itself, so
          # it can never drift from the release this build actually is - see
          # mix pairings.version_check, which fails on a hardcoded version
          # anywhere it expects one derived instead. No -Overwrite either:
          # -outputDir may already hold the previous version's files from the
          # download above, but never this version's, so the safety check
          # that flag would bypass never fires here.
          .\rel\windows\build_installer.ps1 -PayloadDir "_build\prod\rel\pairings_engine_portable" -OutputDir installer_out

      # Everything this target contributes to a release, in one artifact for
      # the release job to collect. The build job cannot attach it itself any
      # more: attaching needs `contents: write`, and a matrix job that runs on
      # every push to main is the last place to hold that.
      #
      # Only the three release SHAPES are here - the single-file binary, the
      # portable zip, the macOS disk image. The per-target artifacts above are
      # a separate thing: they exist for branch builds, which produce no
      # release at all.
      # Must match the `release` job's own condition below. It said tags
      # only until 2026-09-04, while that job had already been widened to
      # publish on a version bump - so the release job ran on main, found no
      # artifacts to download, and died on `ls` with the directory missing.
      # Half a pair changed is worse than neither: the build went green and
      # the release simply never appeared.
      - name: Collect the release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release_assets_${{ matrix.target }}
          # `*.dmg` matches on macOS only, the zip and the installer_out/*
          # lines only exist on tag builds (Windows-only for installer_out) -
          # so this deliberately does NOT use if-no-files-found: error. Every
          # runner is missing something here, and the release job below is
          # what checks that the set as a whole arrived.
          #
          # installer_out/* is deliberately NOT a bare glob: build_installer.ps1
          # also renames assets.win.json in place there, and RELEASES (the
          # legacy Squirrel feed file) sits there too - neither belongs on the
          # release page, see docs/binaries.md. Named explicitly instead of
          # excluded, so a future file added to that directory does not reach
          # the release by default.
          path: |
            burrito_out/*
            _build/prod/rel/openpairings_portable_${{ matrix.target }}.zip
            _build/prod/rel/*.dmg
            installer_out/*.exe
            installer_out/*.msi
            installer_out/releases.win.json
            installer_out/*.nupkg

  # The only job in this workflow that can write to the repository, and it
  # only exists on a tag. `needs: build` means no release is created unless
  # every target built and smoke-tested first.
  release:
    name: Attach binaries to the release
    needs: build
    # A tag always publishes. A push to main publishes too, but only when
    # mix.exs names a version that has no release yet - so cutting a release
    # is the same act as bumping the version, and the commits that follow a
    # bump do not each cut another. Before this, releases were gated on tags
    # alone: the version moved 0.18 -> 0.22 with no tag behind it, so the
    # newest downloadable build on GitHub was four releases out of date.
    # This job publishes from main as well as from tags: the first green main
    # build that carries a new mix.exs version tags and releases it. So every
    # step that builds an asset for the release page must run under this same
    # condition. Until 2026-09-11 the portable zips and the Windows installers
    # were tag-only, and v0.58.0, released from main, went out without them.
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Only mix.exs is needed, and only on the main-push path - but the
      # checkout is unconditional so the version step never reads a stale or
      # missing file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Work out which version this is, and whether it is already out
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # On a tag, that tag is the release. On main, mix.exs is the single
          # source of truth for the version (mix pairings.version_check keeps
          # CHANGELOG.md, TODO.md and docs/features.md agreeing with it).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 "version:" mix.exs | cut -d'"' -f2)
            if [ -z "$version" ]; then
              echo "Could not read a version out of mix.exs" >&2
              exit 1
            fi
            tag="v${version}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${tag} does not exist yet - publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect every target's release assets
        if: steps.ver.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release_assets_*
          merge-multiple: true
          path: release_assets

      # `ls` on a missing directory exits 2 and says almost nothing, which is
      # how the first widened run failed: a bare "Process completed with exit
      # code 2" that named neither the directory nor the reason.
      - if: steps.ver.outputs.publish == 'true'
        run: |
          if [ ! -d release_assets ] || [ -z "$(ls -A release_assets)" ]; then
            echo "No release assets were downloaded." >&2
            echo "The build job's upload step and this job's condition have to" >&2
            echo "agree about which refs publish. Check both." >&2
            exit 1
          fi

          ls -lhR release_assets

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.ver.outputs.publish == 'true'
        with:
          # Named rather than inferred from the ref, because on a push to main
          # there is no tag to infer from - the action creates this one at the
          # commit being built. On a tag push it is that same tag, so both
          # paths land on one release rather than two.
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          # upload-artifact keeps each file's path relative to the common
          # ancestor of the patterns it was given - which was the workspace
          # root - so the two source directories survive the round trip and
          # are named here rather than globbed blindly. merge-multiple put
          # all five targets into the same two.
          files: |
            release_assets/burrito_out/*
            release_assets/_build/prod/rel/*.zip
            release_assets/_build/prod/rel/*.dmg
            release_assets/installer_out/*.exe
            release_assets/installer_out/*.msi
            release_assets/installer_out/releases.win.json
            release_assets/installer_out/*.nupkg
