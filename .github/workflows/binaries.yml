name: Build binaries

# Builds a single self-contained executable per OS/arch with Burrito, each on
# its NATIVE runner (so the SQLite NIF is native - no cross-compile guesswork).
#
# Runs on EVERY push to main, not only on tags. It used to be tags plus manual
# dispatch, and the result was a month between builds while the app changed
# underneath them - by the time anyone looked, "do the binaries still build"
# was a question nobody could answer without an experiment. The binaries are a
# shipped artifact; a shipped artifact that is only built at release time is
# only tested at release time.
#
# Deliberately NO `paths-ignore` for docs. CHANGELOG.md is compiled INTO the
# binary (`PairingsEngine.Changelog` reads it via @external_resource at build
# time), so a "docs-only" change is not docs-only here.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mac_only:
        description: "Build, sign and notarise only the Mac apps; publish nothing (for testing the signing)"
        type: boolean
        default: false

# A run per push, and pushing three commits in a row should not tie up five
# runners building the first two. Tags are exempt: a release build must finish
# even if another tag lands while it is going.
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read-only by default, and the build job below keeps it. Only the release
# job - which runs on tags and nowhere else - is granted `contents: write`.
# It used to be granted here, which handed write access to all five matrix
# jobs on every push to main: five runners, each running third-party actions,
# each able to write to this repository, for a build that publishes nothing.
permissions:
  contents: read

jobs:
  # Which targets this run builds. The Intel Mac build is in the matrix only
  # when a release is about to be published (the same two conditions as the
  # `release` job below: a tag, or a push to main whose mix.exs version has no
  # release yet) or when somebody started the workflow by hand. GitHub's
  # Intel runner is slow: built on every push it cost some thirteen minutes
  # each time, which is why Intel Macs were dropped on 2026-10-14. Ordinary
  # pushes and pull requests do not wait for it. A release that cannot build
  # for Intel is not published: `release` needs `build`.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the targets
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MAC_ONLY: ${{ inputs.mac_only }}
        run: |
          set -euo pipefail

          # Would the release job publish? Its own question, asked early; it
          # also waits for Elixir CI, which this does not, so a red commit
          # may build Intel for nothing. That is the cheap way to be wrong.
          publish=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            publish=true
          elif [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            version=$(grep -m1 "version:" mix.exs | cut -d'"' -f2)
            if [ -z "$version" ]; then
              echo "Could not read a version out of mix.exs" >&2
              exit 1
            fi
            tag="v${version}"
            publish=true
          fi
          if [ "$publish" = true ] && gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists - nothing to publish."
            publish=false
          fi

          # `macos_min` is the oldest macOS the build promises (docs/macos.md,
          # "Intel Macs"). Apple Silicon starts at 11, the first macOS that has it.
          base='[
            {"runner":"macos-15","target":"macos_aarch64","macos_min":"11.0"},
            {"runner":"ubuntu-24.04","target":"linux_x86_64"},
            {"runner":"ubuntu-24.04-arm","target":"linux_aarch64"},
            {"runner":"windows-latest","target":"windows_x86_64"}
          ]'
          if [ "$publish" = true ] || [ "$EVENT" = workflow_dispatch ]; then
            matrix=$(echo "$base" | jq -c '. + [{"runner":"macos-15-intel","target":"macos_x86_64","macos_min":"10.13"}]')
          else
            matrix=$(echo "$base" | jq -c .)
          fi
          # A hand-started run that only wants the Mac apps signed.
          if [ "${MAC_ONLY:-false}" = true ]; then
            matrix=$(echo "$matrix" | jq -c '[.[] | select(.macos_min)]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
        # The rows are in the `plan` job above. Notes that used to sit
        # beside them:
        #   * macOS (2026-10-14): OpenPairings.app in a zip, docs/macos.md.
        #     Apple Silicon always; Intel only when a release goes out.
        #   * linux_x86_64 is ubuntu-24.04 explicitly (was `ubuntu-latest`
        #     until 2026-09-27), as the arm runner is: `ubuntu-latest` is due
        #     to move to a still-preview Ubuntu 26.04 in November 2026, and
        #     that should be a deliberate bump, not whatever push lands after.
        #   * No windows_aarch64: Erlang/OTP publishes no Windows/ARM build,
        #     so setup-beam cannot provision the ARM runner. Windows on ARM
        #     runs the x86_64 binary under its built-in emulation.

    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}
      # One OTP everywhere. On Linux and Windows setup-beam installs it; on
      # the Mac rel/macos/build_otp.sh compiles it, with this OpenSSL and
      # this exact Elixir (setup-beam's "1.20" is the newest 1.20 there).
      OTP_VERSION: "29.0.5"
      OPENSSL_VERSION: "3.5.9"
      ELIXIR_VERSION: "1.20.4"

    steps:
      # Actions are pinned to a commit, not to a tag. A tag is mutable, and
      # whoever can move it runs their code on five runners here. The
      # trailing comment is the human-readable version; .github/dependabot.yml
      # is what keeps the pair current for patch/minor bumps, but ignores
      # majors on purpose - checkout, cache, upload/download-artifact and
      # action-gh-release below were raised by hand on 2026-09-27, for the
      # Node 20 Actions runtime deprecation
      # (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/):
      # the old pins were being silently forced onto Node 24 already.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Not on the Mac. There setup-beam installs erlef/otp_builds' runtime,
      # which is built on the newest runner for the newest macOS: every
      # program in it said "macOS 15 or newer", and a Mac on 14 refused to
      # open the app (2026-10-17). It is compiled below instead.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: runner.os != 'macOS'
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: "1.20"

      # Everything compiled on the Mac - the runtime, the SQLite NIF - for
      # the target's oldest macOS (11, the first version with Apple Silicon,
      # or the Intel build's 10.13), rather than clang's default of the system
      # it runs on. EXQLITE_FORCE_BUILD (config/config.exs): the precompiled
      # SQLite NIF wants macOS 14.
      - name: Build for macOS ${{ matrix.macos_min }} and newer (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_min }}" >> "$GITHUB_ENV"
          echo "EXQLITE_FORCE_BUILD=true" >> "$GITHUB_ENV"

      # Erlang/OTP with a static OpenSSL, both from source: the release
      # carries no Homebrew library (rel/macos/build_app.sh checks every
      # binary for that, and for anything newer than the target). Only the
      # first run with a given set of versions pays; the script is in the
      # key, so a change to how it builds is a new build too.
      - name: Cache Erlang/OTP for macOS ${{ matrix.macos_min }} (macOS)
        if: runner.os == 'macOS'
        id: otp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/otp-macos
          key: otp-${{ env.OTP_VERSION }}-openssl-${{ env.OPENSSL_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('rel/macos/build_otp.sh') }}

      - name: Build Erlang/OTP and OpenSSL from source (macOS, not cached yet)
        if: runner.os == 'macOS' && steps.otp-cache.outputs.cache-hit != 'true'
        run: sh rel/macos/build_otp.sh "$HOME/otp-macos"

      - name: Put Erlang/OTP and Elixir on the PATH (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$HOME/otp-macos/otp/bin" >> "$GITHUB_PATH"
          echo "$HOME/otp-macos/elixir/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/otp-macos/otp/bin:$HOME/otp-macos/elixir/bin:$PATH"
          mix local.hex --force
          mix local.rebar --force
          elixir --version

      # Compiled dependencies, per target. Without this every push downloaded
      # and compiled every dependency from scratch on every runner. Keyed on
      # the lock file and the toolchain, so a dependency or OTP/Elixir change
      # starts clean; `_build/prod/lib` only - never `rel`, which is this
      # run's output and must not come from an earlier commit. The macOS
      # deployment target too (empty off the Mac): a NIF compiled, or
      # downloaded, for another macOS must not come back from the cache.
      - name: Cache deps and compiled dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/prod/lib
          key: binaries-${{ matrix.target }}-otp29.0.5-ex1.20-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            binaries-${{ matrix.target }}-otp29.0.5-ex1.20-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          # Burrito 1.5 requires exactly this Zig version.
          version: 0.15.2
          # No build cache: on 2026-10-14 Windows restored one from a run
          # that was cancelled halfway, minus the build runner it pointed at,
          # and Burrito failed twice in a row on a file that wasn't there.
          # A clean Zig build costs a minute; a poisoned cache costs a release.
          use-cache: false

      # Burrito shells out to `xz` to compress the payload. The Linux and macOS
      # images ship one; Windows does not, and there is no chocolatey package
      # for it, so take it from the preinstalled MSYS2. Only xz and its DLLs are
      # copied out: putting all of C:\msys64\usr\bin on PATH would shadow
      # Windows tools (find, sort, link) for the build steps below.
      - name: Install xz (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed xz
          $dst = Join-Path $env:RUNNER_TEMP "xz"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item C:\msys64\usr\bin\xz.exe $dst
          Copy-Item C:\msys64\usr\bin\msys-2.0.dll $dst
          Copy-Item C:\msys64\usr\bin\msys-lzma-*.dll $dst
          $dst | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Fail here, not deep inside `mix release`, if a DLL is missing.
          & (Join-Path $dst "xz.exe") --version

      # --only prod, because MIX_ENV is prod here and nothing else is needed.
      # --check-locked: a mix.exs constraint edited without a matching
      # mix.lock update re-resolves silently, and the binary shipped from
      # this job would then contain a dependency tree nobody committed.
      - run: mix deps.get --only prod --check-locked

      # Colocated CSS/JS is generated during compile, before assets.deploy.
      - run: mix compile
      - run: mix assets.deploy

      # Named explicitly. `default_release` in mix.exs covers the bare form,
      # but a build script should not depend on which release is the default.
      #
      # Not on the Mac (2026-10-17): Burrito's own Erlang there wants macOS 15,
      # and the .app and the portable zip, built below, do not. No single-file
      # Mac binary is shipped any more.
      - name: Build the single-file binary (Linux and Windows)
        if: runner.os != 'macOS'
        run: mix release pairings_engine --overwrite

      # Pinned to the same velopack_libc version as the `vpk` pin further
      # down (1.2.0) - not "latest", for the same reason that pin is a
      # version and not a floating one. The checksum is this exact .zip's
      # own SHA256, computed once from the real download and hardcoded here,
      # so a corrupted or substituted asset on GitHub's end fails this step
      # loudly rather than shipping silently in every release from here on.
      #
      # Hard-fail (no soft skip like "Skipping OpenPairings.exe" below):
      # unlike a developer machine that may not have Zig installed, this
      # runner always has network access, so a failure here means something
      # is actually wrong - the checksum mismatching most of all - and that
      # is worth stopping the whole Windows build over, not shipping a
      # release that silently lacks the in-app update button.
      #
      # Runs on every push, same as the rest of this job (see this file's
      # own top comment on why binaries build on every push and not only
      # tags): mix.exs's windows_velopack_dll/1 release step below copies
      # this DLL into the portable payload whenever it is present, and skips
      # itself otherwise - the same soft behaviour a developer machine
      # without this file gets locally, so a branch build missing it just
      # does not carry the button.
      - name: Fetch velopack_libc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vpkcVersion = "1.2.0"
          $url = "https://github.com/velopack/velopack/releases/download/$vpkcVersion/velopack_libc_$vpkcVersion.zip"
          $expectedSha256 = "547262ed7a1ab1ff62f580aa53851ede2f1a451ac61b8974eb7bc01117488835"
          $zip = Join-Path $env:RUNNER_TEMP "velopack_libc.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "velopack_libc"

          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "velopack_libc_$vpkcVersion.zip checksum mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -Path $zip -DestinationPath $extractDir -Force

          # Renamed on the way in - see rel/windows/.gitignore and mix.exs's
          # windows_velopack_dll/1: velopack_libc.dll is the name baked into
          # this DLL's own export table, not the filename Velopack ships it
          # under (confirmed by actually loading it under that name).
          $dll = Join-Path $extractDir "lib\velopack_libc_win_x64_msvc.dll"
          if (-not (Test-Path $dll)) {
            throw "lib\velopack_libc_win_x64_msvc.dll not found in velopack_libc_$vpkcVersion.zip"
          }
          Copy-Item -Path $dll -Destination "rel\windows\velopack_libc.dll" -Force

          Get-Item "rel\windows\velopack_libc.dll" |
            Select-Object Name, @{n = 'KB'; e = { [math]::Round($_.Length / 1KB, 1) } }

      # The same app as an ordinary Erlang release - a folder with the runtime
      # inside and a launcher beside it. Built because the single-file binary
      # gets DELETED by antivirus, not warned about: an unsigned executable
      # carrying a compressed payload that unpacks a runtime and spawns
      # processes is byte-for-byte what a dropper looks like. Signing is the
      # real fix on Windows and needs a certificate and a hardware token; this
      # needs neither and works today.
      - run: mix release pairings_engine_portable --overwrite

      # The Windows entry point, OpenPairings.exe, is produced by a release
      # step (mix.exs -> windows_launcher/1) that skips itself when Zig is not
      # on PATH. Zig is always on PATH here, so a missing file means the step
      # did not run at all - and nothing downstream would notice until somebody
      # tried to pack an installer, or worse, ran one.
      #
      # The subsystem check is the other half. "No console window" is one
      # linker flag, it is invisible in the source, and a regression would only
      # show up as a black window on an arbiter's screen.
      - name: Check the Windows launcher was built
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "_build\prod\rel\pairings_engine_portable\OpenPairings.exe"
          if (-not (Test-Path $exe)) {
            throw "No OpenPairings.exe in the portable release - the mix.exs release step did not run."
          }
          $item = Get-Item $exe
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($item.FullName).FileVersion
          Write-Host "OpenPairings.exe $version, $([math]::Round($item.Length / 1KB, 1)) KB"

          $bytes = [System.IO.File]::ReadAllBytes($item.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 92)
          if ($subsystem -ne 2) {
            throw "OpenPairings.exe has subsystem $subsystem, not 2 (GUI) - it would show a console window."
          }

          # velopack_libc.dll travels with the release step above, not as an
          # overlay - see mix.exs's windows_velopack_dll/1. The "Fetch
          # velopack_libc" step earlier in this job hard-fails if it cannot
          # get the DLL, so finding it missing here means the release step
          # itself did not run, the same reasoning the OpenPairings.exe check
          # above already applies.
          $dll = "_build\prod\rel\pairings_engine_portable\velopack_libc.dll"
          if (-not (Test-Path $dll)) {
            throw "No velopack_libc.dll in the portable release - the mix.exs windows_velopack_dll/1 release step did not run."
          }
          Write-Host "velopack_libc.dll $([math]::Round((Get-Item $dll).Length / 1KB, 1)) KB"

      # Prove the thing we just built actually starts. A Burrito build can
      # succeed and still produce a binary that dies at boot - the release
      # evaluates config/runtime.exs, which the test suite exercises through
      # Config.Reader but never through a real BEAM start with a real
      # self-extracting wrapper around it.
      #
      # Started with NO configuration - no OPENPAIRINGS_LOCAL, nothing but a
      # scratch data directory and a port to keep runners isolated. That is
      # deliberate: the first version of this passed `OPENPAIRINGS_LOCAL=1`,
      # which proved the flag worked and said nothing about what happens when
      # somebody just runs the file. Which is what they do, and it crashed -
      # "environment variable DATABASE_PATH is missing" plus a crash dump.
      #
      # So the binary now defaults to local mode (it exports `__BURRITO`, and
      # a self-extracting executable is not a server), and this step is the
      # thing that would have caught that: run it the way a person runs it.
      # The assertion is that the page comes back AND carries the
      # auto-signed-in owner's address.
      - name: Smoke test the binary (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin=$(find burrito_out -maxdepth 1 -type f | head -1)
          echo "starting $bin"
          chmod +x "$bin"

          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-smoke"
          export PORT=4001

          "$bin" start > "$RUNNER_TEMP/smoke.log" 2>&1 &
          pid=$!

          ok=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4001/ 2>/dev/null); then
              ok=yes
              break
            fi
            # If it already exited, stop waiting for a server that is gone.
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$ok" ]; then
            echo "::error::binary did not serve a page"
            cat "$RUNNER_TEMP/smoke.log" || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          kill "$pid" 2>/dev/null || true

          case "$body" in
            *".local"*) echo "signed in as the local owner" ;;
            *) echo "::error::served a page but did not auto-sign-in"
               echo "$body" | head -40
               exit 1 ;;
          esac

      - name: Smoke test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = (Get-ChildItem burrito_out -File | Select-Object -First 1).FullName
          Write-Host "starting $bin"

          $env:OPENPAIRINGS_DATA_DIR = Join-Path $env:RUNNER_TEMP "op-smoke"
          $env:PORT = "4001"

          $log = Join-Path $env:RUNNER_TEMP "smoke.log"
          $proc = Start-Process -FilePath $bin -ArgumentList "start" -PassThru `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow

          $body = $null
          foreach ($i in 1..90) {
            try {
              $body = (Invoke-WebRequest -Uri "http://127.0.0.1:4001/" -TimeoutSec 5 -UseBasicParsing).Content
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 2
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          if (-not $body) {
            Write-Host "::error::binary did not serve a page"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path "$log.err") { Get-Content "$log.err" }
            exit 1
          }

          if ($body -notmatch "\.local") {
            Write-Host "::error::served a page but did not auto-sign-in"
            Write-Host ($body.Substring(0, [Math]::Min(2000, $body.Length)))
            exit 1
          }

          Write-Host "signed in as the local owner"

      - name: Smoke test the portable release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-portable"
          export PORT=4002

          # Through the LAUNCHER, not the release script underneath it: the
          # launcher is what sets local mode here, so testing around it would
          # test everything except the part that is new.
          rel_dir=_build/prod/rel/pairings_engine_portable
          chmod +x "$rel_dir/openpairings.sh"
          "$rel_dir/openpairings.sh" > "$RUNNER_TEMP/portable.log" 2>&1 &
          pid=$!

          body=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4002/ 2>/dev/null); then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          # Erlang distribution must be off end-to-end for this launcher - see
          # the CHANGELOG entries mentioning "distribution". Checked here,
          # while the process from above is still up, rather than in a step
          # of its own: openpairings.sh is Unix-only, this step already
          # starts it for real, and a second boot would only prove the same
          # thing slower. Linux only - the macOS runner gets its own check
          # below, against the .app bundle rather than this script, because
          # that bundle carries its own separately-written launcher.
          #
          # `ss` (iproute2) ships on both Ubuntu images this workflow uses
          # (ubuntu-24.04, ubuntu-24.04-arm); it has no macOS equivalent,
          # which is why that check uses `lsof` instead. `-ltnp` = listening,
          # TCP, numeric (no DNS/service-name lookups slowing this down),
          # with the owning process. No sudo: `ss -p` shows a process without
          # root as long as it belongs to the calling user, which the runner
          # user does here - it started openpairings.sh itself, above.
          dist_status=0
          if [ "$RUNNER_OS" = "Linux" ] && [ -n "$body" ]; then
            listeners=$(ss -ltnp)
            echo "$listeners"

            # epmd, if it started at all, is what distribution needs to be
            # reachable - so its absence is the headline check.
            if echo "$listeners" | awk '$1=="LISTEN"{print $4}' | grep -q ':4369$'; then
              echo "::error::epmd is listening on 4369 - Erlang distribution is on"
              dist_status=1
            fi

            # Whatever the BEAM itself has open must be exactly the web port,
            # on loopback, and nothing else - a stray distribution listener
            # is opened by the same process, not a second one.
            beam_addrs=$(echo "$listeners" | awk '$1=="LISTEN" && $NF ~ /beam/ {print $4}' | sort -u)
            echo "beam.smp listening on: ${beam_addrs:-<nothing found>}"

            if [ -z "$beam_addrs" ]; then
              echo "::error::no beam.smp listener found in ss output"
              dist_status=1
            elif [ "$beam_addrs" != "127.0.0.1:${PORT}" ]; then
              echo "::error::the BEAM is listening on more than the web port"
              dist_status=1
            fi
          fi

          kill "$pid" 2>/dev/null || true

          case "$body" in
            *".local"*) echo "portable release signed in as the local owner" ;;
            *) echo "::error::portable release did not serve a signed-in page"
               cat "$RUNNER_TEMP/portable.log" || true
               exit 1 ;;
          esac

          if [ "$dist_status" != 0 ]; then
            exit 1
          fi

      - name: Smoke test the portable release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENPAIRINGS_DATA_DIR = Join-Path $env:RUNNER_TEMP "op-portable"
          $env:PORT = "4002"
          $log = Join-Path $env:RUNNER_TEMP "portable.log"

          $launcher = "_build\prod\rel\pairings_engine_portable\OpenPairings.bat"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $launcher -PassThru `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" -NoNewWindow

          $body = $null
          foreach ($i in 1..90) {
            try {
              $body = (Invoke-WebRequest -Uri "http://127.0.0.1:4002/" -TimeoutSec 5 -UseBasicParsing).Content
              break
            } catch {
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 2
            }
          }

          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }

          if (-not $body -or $body -notmatch "\.local") {
            Write-Host "::error::portable release did not serve a signed-in page"
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path "$log.err") { Get-Content "$log.err" }
            exit 1
          }

          Write-Host "portable release signed in as the local owner"

      - name: Name the downloads after the product
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd burrito_out
          for f in pairings_engine_*; do
            [ -e "$f" ] || continue
            mv "$f" "openpairings_${f#pairings_engine_}"
          done
          ls -l

      - name: Name the downloads after the product (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem burrito_out -File |
            Where-Object { $_.Name -like 'pairings_engine_*' } |
            ForEach-Object {
              Rename-Item $_.FullName -NewName ($_.Name -replace '^pairings_engine_', 'openpairings_')
            }
          Get-ChildItem burrito_out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openpairings_portable_${{ matrix.target }}
          # Straight from where mix assembled it. There used to be a copy
          # step here, purely to rename the folder inside the zip, and it
          # failed on Windows - Git Bash's `cp -r` on the ERTS bin directory
          # gives "cannot create regular file .../erts-17.0.5/bin/erl: File
          # exists". A cosmetic step is not worth a platform-specific bug.
          path: _build/prod/rel/pairings_engine_portable
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - if: runner.os != 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openpairings_${{ matrix.target }}
          path: burrito_out/*
          if-no-files-found: error
          # A tag build's artifacts are also attached to the release below, so
          # these are the throwaway copy - kept long enough to grab one off a
          # branch build, not long enough to accumulate. Tag builds keep the
          # default 90 days.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Zip the portable release for the release page
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os != 'Windows'
        shell: bash
        run: |
          cd _build/prod/rel
          zip -qr "openpairings_portable_${{ matrix.target }}.zip" pairings_engine_portable
          ls -lh openpairings_portable_${{ matrix.target }}.zip

      # OpenPairings.app: the portable release inside a bundle whose
      # executable is rel/macos/Launcher.swift, compiled here with swiftc - a
      # Dock icon and a small window that says it is running and stops it,
      # the browser opened once the port answers - and which runs
      # rel/macos/launcher.sh to start and stop the server. See
      # docs/macos.md for what the arbiter sees and rel/macos/build_app.sh
      # for what the build checks (no Homebrew library in any binary, the
      # oldest macOS they all accept). The version comes from the release
      # itself, which mix.exs gave it: Info.plist keeps placeholders, and
      # mix pairings.version_check fails if one becomes a literal again.
      #
      # This replaced the .dmg (2026-10-14). A zip made by `ditto` keeps the
      # bundle's modes and signature, needs no `hdiutil` (which GitHub's
      # runners refused intermittently with "Resource busy"), and can have a
      # name without a version, so `releases/latest/download/<name>` works.
      - name: Build OpenPairings.app (macOS)
        if: runner.os == 'macOS'
        run: sh rel/macos/build_app.sh _build/prod/rel/pairings_engine_portable _build/prod/rel

      # Developer ID signing and notarisation, with the teapot-chess
      # organisation's secrets. A fork has none of them and gets the ad-hoc
      # signed app (docs/macos.md) and a warning, not a red build.
      #
      # Asked in a step of its own, rather than with the secrets in the job's
      # `env:` so that a step `if:` could read them: job env reaches every
      # step, including the third-party actions above, and a signing key is
      # the last thing to hand them. Only the steps below see a secret.
      - name: Is Apple signing set up? (macOS)
        id: apple
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets present - signing and notarising."
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing secrets (a fork?) - the app ships ad-hoc signed (docs/macos.md)."
          fi

      - name: Sign and notarise (macOS, only with Apple secrets)
        if: runner.os == 'macOS' && steps.apple.outputs.sign == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: sh rel/macos/sign_and_notarize.sh _build/prod/rel/OpenPairings.app

      # The script deletes its keychain when it ends; this is for when it did
      # not get to (a cancelled job, a runner that is about to be thrown away
      # anyway, and the principle of the thing).
      - name: Delete the temporary keychain (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      # Gatekeeper's own verdict on the stapled bundle, which must be a
      # notarised Developer ID one - not merely "accepted", which an ad-hoc
      # signed app on a runner with the check off would also say.
      - name: Gatekeeper accepts the stapled app (macOS)
        if: runner.os == 'macOS' && steps.apple.outputs.sign == 'true'
        run: |
          out=$(spctl -a -vvv -t exec _build/prod/rel/OpenPairings.app 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "source=Notarized Developer ID" || {
            echo "::error::Gatekeeper did not say 'source=Notarized Developer ID'"
            exit 1
          }
          for i in 1 2 3 4 5; do xcrun stapler validate _build/prod/rel/OpenPairings.app && break; [ "$i" -lt 5 ] || echo "::warning::stapler could not confirm the ticket online; Gatekeeper decides below"; sleep 20; done

      # No version in the name, like the other downloads: a link to
      # releases/latest/download/openpairings_app_macos_aarch64.zip stays
      # right. The version is in the app (Finder, Get Info).
      - name: Zip OpenPairings.app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd _build/prod/rel
          ditto -c -k --keepParent OpenPairings.app "openpairings_app_${{ matrix.target }}.zip"
          ls -lh "openpairings_app_${{ matrix.target }}.zip"

      # The zip, unpacked the way an arbiter unpacks it, started through the
      # bundle's own launcher - the file Finder runs. Before this ever ran
      # the launcher for real, a build could succeed and produce an app that
      # died at boot, or booted with distribution on.
      #
      # On top of what the portable checks prove, this one checks what only
      # the app does:
      #   * the bundle is a Dock citizen: no LSUIElement in Info.plist, and its
      #     executable is the compiled launcher of the target's architecture,
      #     not a script;
      #   * it starts from a READ-ONLY bundle, as a download Gatekeeper has
      #     translocated is - a start that writes into its own app fails here;
      #   * a second start leaves at once instead of starting a second server;
      #   * stopping the launcher stops the server, and nothing is left;
      #   * afterwards the bundle's seal is still intact (nothing was written
      #     into it) and the database is in the data folder.
      - name: Smoke test OpenPairings.app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          check="$RUNNER_TEMP/app-check"
          rm -rf "$check"
          mkdir -p "$check"
          ditto -x -k "_build/prod/rel/openpairings_app_${{ matrix.target }}.zip" "$check"
          app="$check/OpenPairings.app"
          launcher="$app/Contents/MacOS/OpenPairings"
          chmod -R a-w "$app"

          export OPENPAIRINGS_DATA_DIR="$RUNNER_TEMP/op-app"
          export PORT=4003

          status=0
          fail() { echo "::error::$1"; status=1; }

          # A Dock icon needs no LSUIElement, and an executable that is a
          # real program: the compiled launcher, of the target's architecture.
          plist="$app/Contents/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$plist" >/dev/null 2>&1; then
            fail "Info.plist has LSUIElement: the app would have no Dock icon"
          fi
          exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          [ "$app/Contents/MacOS/$exe" = "$launcher" ] ||
            fail "CFBundleExecutable is '$exe', not the launcher this test starts"
          kind=$(file -b "$launcher")
          echo "Contents/MacOS/$exe: $kind"
          case "${{ matrix.target }}" in
            macos_x86_64) arch=x86_64 ;;
            *) arch=arm64 ;;
          esac
          case "$kind" in
            "Mach-O 64-bit executable $arch"*) ;;
            *) fail "Contents/MacOS/$exe is not a Mach-O $arch executable: $kind" ;;
          esac
          # What the bundle promises, and what its programs ask for: both
          # printed (build_app.sh also checks the second). The proof that the
          # oldest macOS is real.
          echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "${{ matrix.macos_min }}" ] ||
            fail "LSMinimumSystemVersion is not ${{ matrix.macos_min }}"
          find "$app" -type f -print0 | xargs -0 file | grep 'Mach-O' | cut -d: -f1 | while IFS= read -r f; do
            echo "$(vtool -show-build "$f" 2>/dev/null | awk '$1 == "minos" || $1 == "version" {print "minos " $2; exit}') $f"
          done | sort | uniq -c | sort -rn | head -40

          # --headless: no window and no browser on a runner nobody looks at,
          # see Launcher.swift's header. Everything else is the real thing,
          # through the bundle's own executable.
          "$launcher" --headless > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!

          body=""
          for _ in $(seq 1 90); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:4003/ 2>/dev/null); then break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 2
          done

          if [ -z "$body" ]; then
            echo "::error::OpenPairings.app did not serve a page"
            cat "$RUNNER_TEMP/app.log" || true
            kill "$pid" 2>/dev/null || true
            exit 1
          fi

          case "$body" in
            *".local"*) echo "OpenPairings.app signed in as the local owner" ;;
            *) fail "OpenPairings.app served a page but did not auto-sign-in"
               echo "$body" | head -40 ;;
          esac

          # Distribution off and loopback only, as for the portable release
          # above. `lsof`, not `ss`: the macOS image has no iproute2. -nP:
          # no DNS or service-name lookups. No sudo needed for the runner's
          # own processes.
          listeners=$(lsof -nP -iTCP -sTCP:LISTEN)
          echo "$listeners"
          if echo "$listeners" | awk 'NR>1{print $9}' | grep -q ':4369$'; then
            fail "epmd is listening on 4369 - Erlang distribution is on"
          fi
          beam_addrs=$(echo "$listeners" | awk 'NR>1 && $1 ~ /beam/ {print $9}' | sort -u)
          echo "beam.smp listening on: ${beam_addrs:-<nothing found>}"
          if [ "$beam_addrs" != "127.0.0.1:${PORT}" ]; then
            fail "the BEAM listens on '${beam_addrs}', not on 127.0.0.1:${PORT} alone"
          fi

          # A second double-click: must see the running one and leave.
          "$launcher" --headless > "$RUNNER_TEMP/app-second.log" 2>&1 &
          second=$!
          for _ in $(seq 1 15); do
            kill -0 "$second" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$second" 2>/dev/null; then
            fail "a second start did not leave; it would have been a second server"
            kill "$second" 2>/dev/null || true
          fi
          servers=$( (lsof -nP -iTCP:"$PORT" -sTCP:LISTEN -t || true) | sort -u | wc -l | tr -d ' ')
          [ "$servers" = 1 ] || fail "$servers processes listen on $PORT after a second start"

          # Stop: SIGTERM to the launcher, which stops the server the way Quit
          # does. The server goes too.
          kill -TERM "$pid" 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then fail "the launcher did not stop within 30 seconds"; fi
          if pgrep -fl "$check" ; then
            fail "something from the app is still running after the launcher stopped"
            pkill -9 -f "$check" || true
          fi

          chmod -R u+w "$app"
          codesign --verify --deep --strict "$app" ||
            fail "the bundle's seal is broken: something was written into the app"
          [ -f "$OPENPAIRINGS_DATA_DIR/openpairings.db" ] ||
            fail "no database in the data folder ($OPENPAIRINGS_DATA_DIR)"

          if [ "$status" != 0 ]; then
            cat "$RUNNER_TEMP/app.log" || true
          fi
          exit "$status"

      # On every push, not only for a release: this is what the owner of a
      # Mac downloads from the run's page to try a build before anything is
      # published (docs/macos.md, "Testing a build").
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: openpairings_app_${{ matrix.target }}
          path: _build/prod/rel/openpairings_app_${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

      - name: Zip the portable release for the release page (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "_build/prod/rel/openpairings_portable_${{ matrix.target }}.zip"
          Compress-Archive -Path "_build/prod/rel/pairings_engine_portable" -DestinationPath $out
          Get-Item $out | Select-Object Name, Length

      # The Windows installers (Setup.exe + the .msi) and the update feed a
      # future in-app updater will read - see docs/binaries.md's "The Windows
      # installers and the update feed" for what gets attached and why, and
      # rel/windows/build_installer.ps1's .NOTES for what building --msi
      # established about where it installs and whether it can update
      # without admin. Tag builds only, same as the zip above: a real
      # installer for every push to main is not worth the ~45s WiX
      # compilation costs for builds that are never downloaded.
      - name: Install vpk (Windows)
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to the exact version this was built and verified against
          # locally (`vpk --version`) - not "latest", which would let a vpk
          # release nobody has run against this project's payload decide
          # what ships.
          dotnet tool install -g vpk --version 1.2.0

      - name: Fetch the previous Windows release for delta packages
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best-effort, deliberately not checked. `vpk pack` below (its
          # default --delta BestSpeed, unchanged by build_installer.ps1) only
          # produces a delta package when it finds a previous version's
          # .nupkg already sitting in -outputDir to diff against - it does
          # not fetch one itself, so this is what makes delta generation do
          # anything at all. It can legitimately find nothing: the first tag
          # to carry this feed has no previous release to fetch, and that is
          # not a failure - `vpk pack` below still succeeds either way, it
          # just ships a Full-only package for this version when there was
          # nothing to diff against. A transient network error here must not
          # fail the release either, hence `exit 0` regardless of how the
          # command above went.
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          vpk download github --repoUrl https://github.com/teapot-chess/openpairings --channel win --outputDir installer_out --token $env:GH_TOKEN

          # Discard a download whose version equals the one THIS job is
          # building - found 2026-09-11 re-running a release build for an
          # already-published tag: `vpk download github` fetches the LATEST
          # release, which on a re-run IS this version, and `vpk pack` below
          # then refuses outright ("already holds a $Version package" - see
          # build_installer.ps1's own check) even though a real PREVIOUS
          # version's .nupkg would otherwise be sitting right next to it to
          # diff against. A normal next-version build never hits this - the
          # latest published release is always the version before the one
          # being built - so this only ever discards something on exactly
          # the re-run case, and a normal build's deltas are untouched.
          $match = Select-String -Path mix.exs -Pattern 'version:\s*"([0-9]+\.[0-9]+\.[0-9]+)"' |
            Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if (Test-Path installer_out) {
            Get-ChildItem installer_out -Filter "*$version*.nupkg" -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "Discarding downloaded $($_.Name) - same version as this build ($version)" -ForegroundColor DarkGray
                Remove-Item $_.FullName -Force
              }
          }

          exit 0

      - name: Pack the Windows installers
        if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && runner.os == 'Windows'
        shell: pwsh
        run: |
          # No -Version: build_installer.ps1 reads it from mix.exs itself, so
          # it can never drift from the release this build actually is - see
          # mix pairings.version_check, which fails on a hardcoded version
          # anywhere it expects one derived instead. No -Overwrite either:
          # -outputDir may already hold the previous version's files from the
          # download above, but never this version's, so the safety check
          # that flag would bypass never fires here.
          .\rel\windows\build_installer.ps1 -PayloadDir "_build\prod\rel\pairings_engine_portable" -OutputDir installer_out

      # Everything this target contributes to a release, in one artifact for
      # the release job to collect. The build job cannot attach it itself any
      # more: attaching needs `contents: write`, and a matrix job that runs on
      # every push to main is the last place to hold that.
      #
      # Only the three release SHAPES are here - the single-file binary (Linux
      # and Windows), the portable zip, the macOS app's zip. The per-target artifacts above are
      # a separate thing: they exist for branch builds, which produce no
      # release at all.
      # Must match the `release` job's own condition below. It said tags
      # only until 2026-09-04, while that job had already been widened to
      # publish on a version bump - so the release job ran on main, found no
      # artifacts to download, and died on `ls` with the directory missing.
      # Half a pair changed is worse than neither: the build went green and
      # the release simply never appeared.
      - name: Collect the release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release_assets_${{ matrix.target }}
          # The app zip exists on macOS only, the installer_out/* lines on
          # Windows only -
          # so this deliberately does NOT use if-no-files-found: error. Every
          # runner is missing something here, and the release job below is
          # what checks that the set as a whole arrived.
          #
          # installer_out/* is deliberately NOT a bare glob: build_installer.ps1
          # also renames assets.win.json in place there, and RELEASES (the
          # legacy Squirrel feed file) sits there too - neither belongs on the
          # release page, see docs/binaries.md. Named explicitly instead of
          # excluded, so a future file added to that directory does not reach
          # the release by default.
          path: |
            burrito_out/*
            _build/prod/rel/openpairings_portable_${{ matrix.target }}.zip
            _build/prod/rel/openpairings_app_${{ matrix.target }}.zip
            installer_out/*.exe
            installer_out/*.msi
            installer_out/releases.win.json
            installer_out/*.nupkg

  # The only job in this workflow that can write to the repository.
  # `needs: build` means no release is created unless every target built and
  # smoke-tested first, and the test gate below adds: and the tests passed.
  release:
    name: Attach binaries to the release
    needs: [plan, build]
    # A tag always publishes. A push to main publishes too, but only when
    # mix.exs names a version that has no release yet - so cutting a release
    # is the same act as bumping the version, and the commits that follow a
    # bump do not each cut another. Before this, releases were gated on tags
    # alone: the version moved 0.18 -> 0.22 with no tag behind it, so the
    # newest downloadable build on GitHub was four releases out of date.
    # This job publishes from main as well as from tags: the first green main
    # build that carries a new mix.exs version tags and releases it. So every
    # step that builds an asset for the release page must run under this same
    # condition. Until 2026-09-11 the portable zips and the Windows installers
    # were tag-only, and v0.58.0, released from main, went out without them.
    if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && !inputs.mac_only
    # Pinned, not `ubuntu-latest` - see the build job's linux_x86_64 comment
    # above on the November 2026 Ubuntu 26.04 switch.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless attestation: the OIDC token and the right to store the result.
      id-token: write
      attestations: write
      # Read-only, and only so the test gate below can ask the API how the
      # "Elixir CI" run for this commit ended.
      actions: read

    steps:
      # Only mix.exs is needed, and only on the main-push path - but the
      # checkout is unconditional so the version step never reads a stale or
      # missing file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out which version this is, and whether it is already out
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # On a tag, that tag is the release. On main, mix.exs is the single
          # source of truth for the version (mix pairings.version_check keeps
          # CHANGELOG.md, TODO.md and docs/features.md agreeing with it).
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(grep -m1 "version:" mix.exs | cut -d'"' -f2)
            if [ -z "$version" ]; then
              echo "Could not read a version out of mix.exs" >&2
              exit 1
            fi
            tag="v${version}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${tag} does not exist yet - publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A red test run must block the release. 0.85.0 went out with a failed
      # "Elixir CI" run behind it (one flaky test) because this workflow and
      # that one are independent: both fire on the same push, and nothing here
      # waited for the other. `needs: build` only proves the binaries build and
      # start, not that the test suite passed.
      #
      # Chosen over a `workflow_run` trigger on Elixir CI: that trigger runs
      # from the default branch's copy of the workflow, with a different
      # github.sha/ref, and would split the build matrix from the release job
      # and break the tag path (tags never trigger Elixir CI, so a tag push
      # would never publish). Chosen over merging the test job into this file:
      # that duplicates Elixir CI and lets the two drift. Asking the API about
      # the commit being released keeps both workflows, the build matrix and
      # the secrets exactly as they are, and works for a main push and for a
      # tag on a commit that already went through main.
      #
      # It waits (the tests usually finish long before the five-target build
      # does, but not always), and treats "no run at all for this commit after
      # ten minutes" as a failure, not a pass: an unverified commit is not a
      # tested one. After a red run, fix or re-run Elixir CI for the commit,
      # then re-run this job; the gate asks again from scratch.
      - name: Wait for a green Elixir CI run on this commit
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/elixir.yml/runs?head_sha=${GITHUB_SHA}&per_page=50")
            total=$(echo "$runs" | jq '.workflow_runs | length')
            green=$(echo "$runs" | jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')
            pending=$(echo "$runs" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            elapsed=$(( $(date +%s) - start ))

            if [ "$green" -gt 0 ]; then
              echo "Elixir CI passed for ${GITHUB_SHA} - releasing."
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::Elixir CI did not pass for ${GITHUB_SHA}; not publishing a release over a red test run."
              echo "$runs" | jq -r '.workflow_runs[] | "  \(.html_url) -> \(.conclusion)"'
              exit 1
            fi
            if [ "$total" -eq 0 ] && [ "$elapsed" -ge 600 ]; then
              echo "::error::No Elixir CI run found for ${GITHUB_SHA} after 10 minutes; refusing to release an untested commit."
              exit 1
            fi
            if [ "$elapsed" -ge 2700 ]; then
              echo "::error::Elixir CI for ${GITHUB_SHA} was still running after 45 minutes; not publishing."
              exit 1
            fi
            echo "Elixir CI for ${GITHUB_SHA}: ${total} run(s), ${pending} still going. Waiting..."
            sleep 30
          done

      - name: Collect every target's release assets
        if: steps.ver.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release_assets_*
          merge-multiple: true
          path: release_assets

      # `ls` on a missing directory exits 2 and says almost nothing, which is
      # how the first widened run failed: a bare "Process completed with exit
      # code 2" that named neither the directory nor the reason.
      - if: steps.ver.outputs.publish == 'true'
        run: |
          if [ ! -d release_assets ] || [ -z "$(ls -A release_assets)" ]; then
            echo "No release assets were downloaded." >&2
            echo "The build job's upload step and this job's condition have to" >&2
            echo "agree about which refs publish. Check both." >&2
            exit 1
          fi

          ls -lhR release_assets

          # Both Mac apps, by name: the Intel one is only built for a release
          # (the `plan` job), and a release without it must not go out
          # looking complete.
          if [ "${{ steps.ver.outputs.publish }}" = true ]; then
            for f in openpairings_app_macos_aarch64.zip openpairings_app_macos_x86_64.zip; do
              [ -f "release_assets/_build/prod/rel/$f" ] || { echo "::error::$f is missing from the release assets"; exit 1; }
            done
          fi

      # One file of checksums for everything attached below, under the names
      # the release page shows (no directories). New with macOS
      # (2026-10-14): an unsigned app is a download people are asked to
      # trust by hand, and "compare it with SHA256SUMS" is the one check
      # that costs them nothing. A fixed name, like the rest.
      - name: Sum the release assets
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          : > SHA256SUMS
          # The same globs as `files:` below.
          set -- release_assets/burrito_out/* release_assets/_build/prod/rel/*.zip
          set -- "$@" release_assets/installer_out/*.exe release_assets/installer_out/*.msi
          set -- "$@" release_assets/installer_out/releases.win.json release_assets/installer_out/*.nupkg
          for f in "$@"; do
            [ -f "$f" ] || continue
            (cd "$(dirname "$f")" && sha256sum -- "$(basename "$f")") >> SHA256SUMS
          done
          mv SHA256SUMS release_assets/SHA256SUMS
          cat release_assets/SHA256SUMS

      # Signed build provenance, keyless: GitHub's own OIDC token, recorded in
      # the Sigstore transparency log, so there is no maintainer-held key to
      # lose or leak. Covers every file attached below and SHA256SUMS itself.
      # Check with: gh attestation verify <file> --repo teapot-chess/openpairings
      - name: Attest the build provenance
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release_assets/burrito_out/*
            release_assets/_build/prod/rel/*.zip
            release_assets/installer_out/*.exe
            release_assets/installer_out/*.msi
            release_assets/installer_out/releases.win.json
            release_assets/installer_out/*.nupkg
            release_assets/SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.ver.outputs.publish == 'true'
        with:
          # Named rather than inferred from the ref, because on a push to main
          # there is no tag to infer from - the action creates this one at the
          # commit being built. On a tag push it is that same tag, so both
          # paths land on one release rather than two.
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          # upload-artifact keeps each file's path relative to the common
          # ancestor of the patterns it was given - which was the workspace
          # root - so the two source directories survive the round trip and
          # are named here rather than globbed blindly. merge-multiple put
          # all five targets into the same two.
          files: |
            release_assets/burrito_out/*
            release_assets/_build/prod/rel/*.zip
            release_assets/installer_out/*.exe
            release_assets/installer_out/*.msi
            release_assets/installer_out/releases.win.json
            release_assets/installer_out/*.nupkg
            release_assets/SHA256SUMS

      # GitHub's API has answered a release creation with HTTP 500 while
      # creating the release anyway (v0.60.1, 2026-09-13): the action retried,
      # each "failed" attempt left an empty draft with the same tag, and the
      # action's own duplicate cleanup then failed as well. Delete what is left -
      # only drafts, only for this tag, only with no assets, and only once a
      # published release for the tag exists - so the release list and
      # `gh release view <tag>` see exactly one release.
      - name: Remove empty duplicate drafts for this tag
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          published=$(echo "$releases" | jq --arg tag "$TAG" '[.[] | select(.tag_name == $tag and (.draft | not))] | length')
          if [ "$published" -lt 1 ]; then
            echo "No published release for ${TAG} - leaving every draft alone."
            exit 0
          fi
          echo "$releases" |
            jq -r --arg tag "$TAG" '.[] | select(.draft and .tag_name == $tag and (.assets | length) == 0) | .id' |
            while read -r id; do
              echo "Deleting empty duplicate draft ${id} for ${TAG}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" ||
                echo "::warning::could not delete empty draft ${id} for ${TAG}"
            done
