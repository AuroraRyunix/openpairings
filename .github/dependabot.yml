version: 2

# Both workflows pin every third-party action to a commit SHA, with the
# version tag as a trailing comment. That is the safe way to use somebody
# else's action - a tag can be moved, a commit cannot - but a pin nobody
# updates is a pin that rots, and the trailing comment is the only thing
# telling a reader which version they are on.
#
# Dependabot understands exactly this convention: it opens a pull request
# that moves the SHA and rewrites the comment together, so the pair stays
# honest without anyone looking a SHA up by hand.
#
# Weekly, and github-actions only. Hex dependencies are deliberately not
# managed here: mix.lock changes are checked against a full test run and a
# five-target binary build, and a stream of automated bumps for them is a
# different decision from keeping CI's own supply chain current.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
